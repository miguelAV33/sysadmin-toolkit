# Configuración de ejemplo para healthcheck.sh  (uso: healthcheck.sh -c FICHERO)
#
# Formato CLAVE=valor. El fichero se lee línea a línea y NUNCA se ejecuta:
# solo se aceptan las claves de esta lista. Si un valor lleva espacios, va
# entre comillas. Las opciones de la línea de comandos tienen prioridad.

# Nombre que aparece en el informe (por defecto, el nombre del host).
ETIQUETA="web-01"

# Umbrales en porcentaje: aviso / crítico          Opción equivalente
DISCO_AVISO=80                                     # --disk-warn
DISCO_CRITICO=90                                   # --disk-crit
INODOS_AVISO=80                                    # --inode-warn
INODOS_CRITICO=90                                  # --inode-crit
MEMORIA_AVISO=85                                   # --mem-warn
MEMORIA_CRITICO=95                                 # --mem-crit
SWAP_AVISO=50                                      # --swap-warn
SWAP_CRITICO=80                                    # --swap-crit

# Carga media de 5 minutos en % del número de núcleos (100 = tantos procesos
# esperando CPU como núcleos hay).
CARGA_AVISO=100                                    # --load-warn
CARGA_CRITICO=200                                  # --load-crit

# Líneas «Failed password» / «Invalid user» de sshd en el log actual.
SSH_AVISO=20                                       # --ssh-warn
SSH_CRITICO=100                                    # --ssh-crit

# Servicios que deben estar activos (con systemd, nombre de la unidad; sin
# systemd, nombre exacto del proceso para pgrep -x).
SERVICIOS="ssh,cron,nginx"                         # --servicios

# Puertos TCP que deben estar en escucha.
PUERTOS_ESPERADOS="22,80,443"                      # --puertos-esperados

# Puntos de montaje a ignorar (patrones glob separados por espacios).
EXCLUIR_MONTAJES="/snap/* /boot/efi"               # --excluir-montaje

# Rutas (descomenta para cambiarlas).
#FICHERO_AUTH=/var/log/auth.log                    # --auth-log
#FICHERO_REINICIO=/var/run/reboot-required         # --fichero-reinicio
