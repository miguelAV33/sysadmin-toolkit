# Ejemplo para NRPE (Nagios / Icinga): añadir a /etc/nagios/nrpe.cfg o a un
# fichero de /etc/nagios/nrpe.d/ y reiniciar el servicio nagios-nrpe-server.
#
# --nagios imprime una sola línea «HEALTHCHECK ESTADO - texto | datos» y el
# código de salida sigue la convención 0 OK, 1 WARNING, 2 CRITICAL, 3 UNKNOWN.
# NRPE se ejecuta como usuario «nagios»: para analizar /var/log/auth.log ese
# usuario tiene que pertenecer al grupo adm (o la comprobación sale como Info).

command[check_salud]=/opt/sysadmin-toolkit/bin/healthcheck.sh --nagios -c /etc/sysadmin-toolkit/healthcheck.conf

# En el servidor de Nagios:
#   define service {
#     use                 generic-service
#     host_name           web-01
#     service_description Salud del servidor
#     check_command       check_nrpe!check_salud
#   }
